# configs/nginx-default.conf
# Cấu hình mặc định của Nginx (Catch-all)
# Mục đích: Chặn toàn bộ các request truy cập trực tiếp bằng địa chỉ IP gốc của VPS 
# hoặc các domain chưa được khai báo cấu hình.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Trả về 444 (Connection Closed Without Response)
    return 444;
}
